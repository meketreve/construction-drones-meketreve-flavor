[mod-setting-description]
throttling=Para um valor N, divide a área de busca de cada jogador em (N*2)^2 partes. Diminuir melhora a resposta, aumentar economiza CPU.
drone_process_other_player_deconstruction=Deixa os drones cumprirem ordens de demolição feitas por outros jogadores.
drone_process_other_player_construction=Deixa os drones cumprirem ordens de construção feitas por outros jogadores.
drone_process_other_player_upgrade=Deixa os drones cumprirem ordens de upgrade feitas por outros jogadores.
drone_process_other_player_proxies=Deixa os drones cumprirem requisições feitas por outros jogadores (módulos, requisições logísticas e afins).
construction-drone-search-radius=Raio, em tiles, onde os drones procuram trabalho.
force-player-position-search=Prende a área de busca ao personagem, então os drones não trabalham à distância pela visão remota.
remote-view-spawn=Deixa os drones serem enviados pela visão remota (não funciona entre superfícies). ATENÇÃO: eles às vezes se perdem no caminho de volta.
drone-chain-search-radius=Depois de demolir, o drone procura fantasmas neste raio, em tiles, que ele já consiga construir com o que está carregando. 0 desliga o encadeamento.
drone-redirect-radius=Quando aparece trabalho, drones que já estão voltando dentro deste raio, em tiles, são redirecionados em vez de sair um drone novo. 0 desliga o redirecionamento.

[controls]
construction-drone-toggle=Ligar e desligar os drones de construção
drone-repair-toggle=Ligar e desligar o uso de kits de reparo pelos drones

