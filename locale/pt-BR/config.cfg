[item-name]
drone-controller=Controlador de drones
drone-garage=Garagem de drones

[item-description]
drone-controller=Ponha em um slot de arma para comandar drones de construção. Cada controlador que você carrega comanda alguns drones ao mesmo tempo, mais ainda se for de qualidade melhor.
drone-garage=Procura trabalho na área dela e manda drones próprios, recebe a carga que eles trazem e divide os drones com as outras garagens: cada drone se recolhe na garagem mais perto de onde terminou. Baús ligados a ela por fio viram depósito dos drones.

[technology-name]
drone-garage=Garagem de drones
spectral-drones=Drones espectrais

[technology-description]
drone-garage=Uma central para onde os drones de construção se reportam. Cada garagem comanda drones próprios, procura trabalho em volta dela e dá aos drones um lugar para descarregar.
spectral-drones=Transforma todos os drones em uma variante "espectral", que atravessa qualquer objeto, menos os tiles intransponíveis.

[technology-effect]
drone-garage=Os drones podem pegar itens de baús ligados à garagem

[message]
no-drone-controller=Os drones de construção não têm de quem receber ordens. Faça um controlador de drones e ponha em um slot de arma.
