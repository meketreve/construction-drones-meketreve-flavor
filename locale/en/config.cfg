[mod-setting-name]
chest-pickup-range=Chest pickup range
throttling=Job search area subdivision

[mod-setting-description]
chest-pickup-range=How far from a job the drones will look for a chest to take the items from, when you are not carrying them yourself. Set to 0 to make the drones only take items out of your own inventory.
throttling=For a value N, divides the per-player search area into (N*2)^2 subdivisions. Reducing the number improves responsiveness, increasing it reduces CPU use.

[controls]
construction-drone-toggle=Toggle construction drones.

[technology-name]
construction-drone-chest-pickup=Construction drone chest pickup

[technology-description]
construction-drone-chest-pickup=Lets the construction drones take the items they need out of nearby chests, instead of only out of your own inventory.

[technology-effect]
construction-drone-chest-pickup=Construction drones can take items from nearby chests
